name: Apply Urtotho redesign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v5

      - name: Apply redesigned interface
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          app_tsx = ''
          app_json = ''

          Path("App.tsx").write_bytes(base64.b64decode(app_tsx))
          Path("app.json").write_bytes(base64.b64decode(app_json))
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json
          git commit -m "Redesign Urtotho interface and add automatic dark mode"
          git push
